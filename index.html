<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Screen Recorder Prototype</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 600px; }
    .controls { display: flex; gap: 10px; margin-bottom: 1rem; }
    button { padding: 8px 16px; cursor: pointer; font-size: 1rem; }
    video { width: 100%; max-height: 350px; background: #111; border-radius: 8px; }
  </style>
</head>
<body>

  <h2>Screen Recorder Prototype</h2>
  
  <div class="controls">
    <button id="startBtn">Start Recording</button>
    <button id="stopBtn" disabled>Stop Recording</button>
  </div>

  <p id="status">Status: Idle</p>

  <!-- Live preview of what is being recorded -->
  <video id="preview" autoplay muted></video>

  <script>
    let mediaRecorder;
    let recordedChunks = [];

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');

    startBtn.addEventListener('click', async () => {
      try {
        // 1. Prompt user to select screen/window/tab
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: { ideal: 30 } },
          audio: true // Captures system/tab audio if supported
        });

        // Show live preview
        preview.srcObject = stream;

        // 2. Initialize MediaRecorder
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });

        // Push video data chunks as they become available
        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            recordedChunks.push(event.data);
          }
        };

        // Handle recording finished
        mediaRecorder.onstop = downloadVideo;

        // Automatically trigger stop if user ends sharing via the browser bar
        stream.getVideoTracks()[0].onended = () => {
          if (mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
            toggleUI(false);
          }
        };

        // 3. Start recording
        mediaRecorder.start();
        toggleUI(true);
        status.innerText = "Status: Recording...";

      } catch (err) {
        console.error("Error starting screen capture:", err);
        status.innerText = "Error: " + err.message;
      }
    });

    stopBtn.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        // Stop all tracks to clear the browser "sharing screen" indicator
        preview.srcObject.getTracks().forEach(track => track.stop());
        toggleUI(false);
        status.innerText = "Status: Stopped. Preparing download...";
      }
    });

    function downloadVideo() {
      // Assemble video chunks into a single Blob object
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);

      // Trigger automatic file download
      const a = document.createElement('a');
      a.href = url;
      a.download = `screen-recording-${Date.now()}.webm`;
      document.body.appendChild(a);
      a.click();
      
      // Cleanup
      URL.revokeObjectURL(url);
      document.body.removeChild(a);
      status.innerText = "Status: Downloaded!";
    }

    function toggleUI(isRecording) {
      startBtn.disabled = isRecording;
      stopBtn.disabled = !isRecording;
    }
  </script>
</body>
</html>
